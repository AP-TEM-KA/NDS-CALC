<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор сделки</title>
    
    <!-- Иконка вкладки (Favicon) - Эмодзи калькулятора 🧮 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
    
    <!-- Иконка для Apple устройств (при добавлении на главный экран) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%234f46e5%22/><text x=%2250%22 y=%2250%22 font-family=%22Arial%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 dy=%22.35em%22>₽</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0d1117',
              }
            }
          }
        }
      }
    </script>

    <!-- Font Awesome (Иконки) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM (Глобальные версии) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (для компиляции JSX прямо в браузере) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Inter', sans-serif; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
    </style>
<script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel" data-presets="react,typescript">
        const { useState, useEffect, useCallback } = React;
        const { createRoot } = ReactDOM;

        // --- TYPES (Игнорируются Babel при исполнении, но полезны для чтения) ---
        // interface TaxSettings { ... }
        // interface CalculationResult { ... }

        // --- COMPONENTS ---

        // 1. TabNavigation
        const TabNavigation = ({ activeTab, onTabChange, isDarkMode, toggleTheme }) => {
            const tabs = [
                { id: 'purchase', label: 'Покупка', icon: 'fa-shopping-cart' },
                { id: 'sale', label: 'Продажа', icon: 'fa-cash-register' },
                { id: 'result', label: 'Итог', icon: 'fa-chart-pie' },
                { id: 'settings', label: 'Настройки', icon: 'fa-cog' },
                { id: 'history', label: 'История', icon: 'fa-history' },
            ];

            return (
                <div className="sticky top-0 z-10 bg-white/90 dark:bg-gray-800/90 backdrop-blur-sm shadow-sm border-b border-gray-200 dark:border-gray-700 mb-6 transition-colors duration-300">
                    <div className="max-w-3xl mx-auto px-2">
                        <div className="flex items-center justify-between">
                            <div className="flex justify-between md:justify-start md:space-x-4 overflow-x-auto no-scrollbar py-2 flex-1">
                                {tabs.map((tab) => (
                                    <button
                                        key={tab.id}
                                        onClick={() => onTabChange(tab.id)}
                                        className={`
                                            flex flex-col md:flex-row items-center justify-center 
                                            px-3 py-2 rounded-lg transition-all duration-200 min-w-[70px] md:min-w-0 flex-shrink-0
                                            ${activeTab === tab.id 
                                                ? 'text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 font-medium' 
                                                : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700/50'}
                                        `}
                                    >
                                        <span className="mb-1 md:mb-0 md:mr-2"><i className={`fas ${tab.icon}`}></i></span>
                                        <span className="text-xs md:text-sm">{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="pl-4 border-l border-gray-200 dark:border-gray-700 ml-2">
                                <button onClick={toggleTheme} className="p-2 rounded-full text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 transition-colors">
                                    <i className={`fas ${isDarkMode ? 'fa-sun' : 'fa-moon'}`}></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. InputPanel
        const InputPanel = ({ type, amount, setAmount, vatIncluded, setVatIncluded, onNext }) => {
            const isPurchase = type === 'purchase';
            const title = isPurchase ? 'Покупка' : 'Продажа';
            const iconColor = isPurchase 
                ? 'bg-indigo-100 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-400' 
                : 'bg-emerald-100 text-emerald-600 dark:bg-emerald-900/50 dark:text-emerald-400';
            const iconClass = isPurchase ? 'fa-shopping-cart' : 'fa-cash-register';
            const description = isPurchase 
                ? 'Введите сумму, которую вы заплатили поставщику. Входящий НДС будет принят к вычету.'
                : 'Введите сумму, за которую вы планируете продать товар или услугу клиенту.';

            return (
                <div className="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 max-w-xl mx-auto animate-fade-in transition-colors duration-300">
                    <div className="flex items-center gap-3 mb-6">
                        <div className={`p-3 rounded-full ${iconColor} w-12 h-12 flex items-center justify-center`}>
                            <i className={`fas ${iconClass} text-xl`}></i>
                        </div>
                        <div>
                            <h2 className="text-xl font-bold text-gray-800 dark:text-white">{title}</h2>
                            <p className="text-sm text-gray-500 dark:text-gray-400">Введите данные сделки</p>
                        </div>
                    </div>

                    <div className="bg-blue-50 dark:bg-blue-900/20 border-l-4 border-blue-500 p-4 mb-6 rounded-r transition-colors">
                        <div className="flex">
                            <i className="fas fa-info-circle text-blue-500 dark:text-blue-400 mr-2 mt-1 flex-shrink-0"></i>
                            <p className="text-sm text-blue-700 dark:text-blue-200">{description}</p>
                        </div>
                    </div>

                    <div className="mb-6">
                        <label className="block text-gray-700 dark:text-gray-300 text-sm font-semibold mb-2">Режим НДС</label>
                        <div className="flex bg-gray-100 dark:bg-gray-700 p-1 rounded-lg transition-colors">
                            <button onClick={() => setVatIncluded(false)} className={`flex-1 py-2 text-sm font-medium rounded-md transition-all ${!vatIncluded ? 'bg-white dark:bg-gray-600 text-gray-800 dark:text-white shadow-sm' : 'text-gray-500 dark:text-gray-400'}`}>Сумма без НДС</button>
                            <button onClick={() => setVatIncluded(true)} className={`flex-1 py-2 text-sm font-medium rounded-md transition-all ${vatIncluded ? 'bg-white dark:bg-gray-600 text-gray-800 dark:text-white shadow-sm' : 'text-gray-500 dark:text-gray-400'}`}>Сумма с НДС</button>
                        </div>
                    </div>

                    <div className="mb-8">
                        <label className="block text-gray-700 dark:text-gray-300 text-sm font-semibold mb-2">Сумма {isPurchase ? 'покупки' : 'продажи'}</label>
                        <div className="relative">
                            <input
                                type="number" inputMode="decimal" placeholder="0" value={amount} onChange={(e) => setAmount(e.target.value)}
                                className="w-full pl-4 pr-12 py-4 text-2xl font-bold text-gray-800 dark:text-white bg-transparent border-2 border-gray-200 dark:border-gray-600 rounded-xl focus:border-indigo-500 dark:focus:border-indigo-400 focus:ring-0 outline-none transition-colors"
                                autoFocus
                            />
                            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 font-medium text-xl">₽</span>
                        </div>
                    </div>

                    <button
                        onClick={onNext}
                        disabled={!amount || parseFloat(amount) <= 0}
                        className={`w-full py-4 rounded-xl font-bold text-lg shadow-lg transition-all transform active:scale-95 ${
                            !amount || parseFloat(amount) <= 0
                                ? 'bg-gray-300 dark:bg-gray-700 text-gray-500 cursor-not-allowed'
                                : 'bg-indigo-600 dark:bg-indigo-500 text-white hover:bg-indigo-700 hover:shadow-indigo-500/30'
                        }`}
                    >
                        {isPurchase ? 'Далее к продаже →' : 'Рассчитать результат'}
                    </button>
                </div>
            );
        };

        // 3. ResultsPanel
        const ResultsPanel = ({ result, settings, onReset }) => {
            if (!result) return null;

            const formatMoney = (amount) => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(amount);
            const maxVal = Math.max(result.purchase.vat, result.sale.vat, Math.abs(result.profit.vatToPay)) || 1;
            const getPercent = (val) => Math.min(100, Math.round((Math.abs(val) / maxVal) * 100));

            return (
                <div className="max-w-4xl mx-auto space-y-6 pb-20 animate-fade-in">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-6 text-white shadow-xl dark:shadow-none">
                            <div className="flex items-center space-x-2 opacity-80 mb-2"><i className="fas fa-piggy-bank text-lg"></i><span className="text-sm font-medium">Чистая прибыль</span></div>
                            <div className="text-3xl font-bold tracking-tight">{formatMoney(result.profit.net)}</div>
                            <div className="mt-4 text-indigo-100 text-xs">После вычета всех налогов и НДС</div>
                        </div>
                        <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-100 dark:border-gray-700 transition-colors">
                            <div className="flex items-center space-x-2 text-gray-500 dark:text-gray-400 mb-2"><i className="fas fa-calculator text-lg"></i><span className="text-sm font-medium">Налоги к уплате</span></div>
                            <div className="text-2xl font-bold text-gray-800 dark:text-gray-100">{formatMoney(result.profit.tax + result.profit.vatToPay)}</div>
                            <div className="mt-4 flex justify-between text-xs text-gray-500 dark:text-gray-400"><span>На прибыль: {formatMoney(result.profit.tax)}</span><span>НДС: {formatMoney(result.profit.vatToPay)}</span></div>
                        </div>
                        <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-100 dark:border-gray-700 transition-colors">
                            <div className="flex items-center space-x-2 text-gray-500 dark:text-gray-400 mb-2"><i className="fas fa-arrow-trend-up text-lg"></i><span className="text-sm font-medium">Маржинальность</span></div>
                            <div className="text-2xl font-bold text-gray-800 dark:text-gray-100">{result.sale.net > 0 ? Math.round((result.profit.net / result.sale.net) * 100) : 0}%</div>
                            <div className="mt-4 text-xs text-gray-500 dark:text-gray-400">Рентабельность сделки</div>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-md border border-gray-100 dark:border-gray-700 transition-colors">
                        <h3 className="font-semibold text-gray-800 dark:text-gray-200 mb-6 flex items-center"><i className="fas fa-chart-simple mr-2 text-indigo-500"></i>Структура НДС</h3>
                        <div className="space-y-5">
                            <div>
                                <div className="flex justify-between text-sm mb-1"><span className="text-gray-500 dark:text-gray-400">Входящий НДС (К вычету)</span><span className="font-bold text-gray-700 dark:text-gray-300">{formatMoney(result.purchase.vat)}</span></div>
                                <div className="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-3"><div className="bg-emerald-400 h-3 rounded-full transition-all duration-500" style={{ width: `${getPercent(result.purchase.vat)}%` }}></div></div>
                            </div>
                            <div>
                                <div className="flex justify-between text-sm mb-1"><span className="text-gray-500 dark:text-gray-400">Исходящий НДС (Начисленный)</span><span className="font-bold text-gray-700 dark:text-gray-300">{formatMoney(result.sale.vat)}</span></div>
                                <div className="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-3"><div className="bg-blue-400 h-3 rounded-full transition-all duration-500" style={{ width: `${getPercent(result.sale.vat)}%` }}></div></div>
                            </div>
                            <div>
                                <div className="flex justify-between text-sm mb-1">
                                    <span className="text-gray-500 dark:text-gray-400">{result.profit.vatToPay >= 0 ? 'Итого НДС к уплате' : 'Итого НДС к возмещению'}</span>
                                    <span className={`font-bold ${result.profit.vatToPay >= 0 ? 'text-red-500 dark:text-red-400' : 'text-emerald-500 dark:text-emerald-400'}`}>{formatMoney(Math.abs(result.profit.vatToPay))}</span>
                                </div>
                                <div className="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-3">
                                    <div className={`${result.profit.vatToPay >= 0 ? 'bg-red-400' : 'bg-emerald-400'} h-3 rounded-full transition-all duration-500`} style={{ width: `${getPercent(result.profit.vatToPay)}%` }}></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 overflow-hidden transition-colors">
                        <div className="bg-gray-50 dark:bg-gray-700/50 px-6 py-4 border-b border-gray-100 dark:border-gray-700">
                            <h3 className="font-semibold text-gray-800 dark:text-gray-200 flex items-center"><i className="fas fa-arrow-trend-down mr-2 text-gray-500 dark:text-gray-400"></i>Детализация расчета</h3>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x border-gray-100 dark:divide-gray-700 dark:border-gray-700">
                            <div className="p-6">
                                <h4 className="text-sm font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-4">Покупка</h4>
                                <div className="space-y-3">
                                    <div className="flex justify-between"><span className="text-gray-600 dark:text-gray-400">Сумма без НДС</span><span className="font-semibold dark:text-gray-200">{formatMoney(result.purchase.net)}</span></div>
                                    <div className="flex justify-between text-sm"><span className="text-gray-500 dark:text-gray-500">Входящий НДС ({settings.purchaseVatRate}%)</span><span className="text-gray-700 dark:text-gray-300">{formatMoney(result.purchase.vat)}</span></div>
                                    <div className="flex justify-between pt-2 border-t border-dashed dark:border-gray-600"><span className="text-gray-800 dark:text-gray-200 font-medium">Итого поставщику</span><span className="font-bold text-indigo-600 dark:text-indigo-400">{formatMoney(result.purchase.gross)}</span></div>
                                </div>
                            </div>
                            <div className="p-6">
                                <h4 className="text-sm font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-4">Продажа</h4>
                                <div className="space-y-3">
                                    <div className="flex justify-between"><span className="text-gray-600 dark:text-gray-400">Сумма без НДС</span><span className="font-semibold dark:text-gray-200">{formatMoney(result.sale.net)}</span></div>
                                    <div className="flex justify-between text-sm"><span className="text-gray-500 dark:text-gray-500">Исходящий НДС ({settings.saleVatRate}%)</span><span className="text-red-500 dark:text-red-400">{formatMoney(result.sale.vat)}</span></div>
                                    <div className="flex justify-between pt-2 border-t border-dashed dark:border-gray-600"><span className="text-gray-800 dark:text-gray-200 font-medium">Итого от клиента</span><span className="font-bold text-emerald-600 dark:text-emerald-400">{formatMoney(result.sale.gross)}</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button onClick={onReset} className="w-full py-4 text-gray-500 dark:text-gray-400 font-medium hover:text-gray-800 dark:hover:text-gray-200 transition-colors">Начать новый расчет</button>
                </div>
            );
        };

        // 4. SettingsPanel
        const SettingsPanel = ({ settings, onSave }) => {
            const [localSettings, setLocalSettings] = useState(settings);
            const handleChange = (key, value) => setLocalSettings(prev => ({ ...prev, [key]: value }));
            const presetRates = [0, 10, 20, 22];

            return (
                <div className="max-w-xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 animate-fade-in transition-colors duration-300">
                    <h2 className="text-xl font-bold text-gray-800 dark:text-white mb-6">Настройки расчета</h2>
                    <div className="space-y-6">
                        {['purchaseVatRate', 'saleVatRate'].map(key => (
                            <div key={key}>
                                <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">{key === 'purchaseVatRate' ? 'НДС при покупке (%)' : 'НДС при продаже (%)'}</label>
                                <div className="flex gap-2">
                                    <input type="number" value={localSettings[key]} onChange={(e) => handleChange(key, parseFloat(e.target.value))} className="w-24 px-3 py-2 border dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white dark:bg-gray-700 dark:text-white transition-colors" />
                                    <div className="flex gap-1 flex-wrap">
                                        {presetRates.map(rate => (
                                            <button key={`${key}-${rate}`} onClick={() => handleChange(key, rate)} className={`px-3 py-2 text-sm rounded-lg transition-colors ${localSettings[key] === rate ? 'bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 font-medium' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600'}`}>{rate}%</button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ))}
                        <div>
                            <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Налог на прибыль (%)</label>
                            <input type="number" value={localSettings.profitTaxRate} onChange={(e) => handleChange('profitTaxRate', parseFloat(e.target.value))} className="w-full px-3 py-2 border dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white dark:bg-gray-700 dark:text-white transition-colors" />
                        </div>
                        <div className="border-t dark:border-gray-700 pt-6">
                            <div className="flex items-center justify-between mb-4">
                                <span className="text-sm font-semibold text-gray-700 dark:text-gray-300">Округление результатов</span>
                                <button onClick={() => handleChange('roundingEnabled', !localSettings.roundingEnabled)} className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${localSettings.roundingEnabled ? 'bg-indigo-600' : 'bg-gray-200 dark:bg-gray-600'}`}>
                                    <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition transition-transform ${localSettings.roundingEnabled ? 'translate-x-6' : 'translate-x-1'}`} />
                                </button>
                            </div>
                            {localSettings.roundingEnabled && (
                                <div className="flex gap-2 bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg">
                                    {['round', 'ceil', 'floor'].map(method => (
                                        <label key={method} className="flex items-center ml-2 first:ml-0">
                                            <input type="radio" checked={localSettings.roundingMethod === method} onChange={() => handleChange('roundingMethod', method)} className="mr-2 text-indigo-600 focus:ring-indigo-500 bg-gray-100 dark:bg-gray-600" />
                                            <span className="text-sm text-gray-600 dark:text-gray-300">{{round:'Матем.', ceil:'Вверх', floor:'Вниз'}[method]}</span>
                                        </label>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                    <button onClick={() => onSave(localSettings)} className="w-full mt-8 flex items-center justify-center py-3 bg-indigo-600 dark:bg-indigo-500 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors shadow-lg"><i className="fas fa-save mr-2"></i>Сохранить настройки</button>
                </div>
            );
        };

        // 5. HistoryPanel
        const HistoryPanel = ({ history, onClear }) => {
            const formatMoney = (amount) => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(amount);
            const formatDate = (ts) => new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

            if (history.length === 0) return (<div className="text-center py-12"><div className="bg-gray-100 dark:bg-gray-800 rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4"><i className="fas fa-trash-alt text-gray-400 text-2xl"></i></div><h3 className="text-lg font-medium text-gray-800 dark:text-white">История пуста</h3></div>);

            return (
                <div className="max-w-2xl mx-auto animate-fade-in">
                    <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-bold text-gray-800 dark:text-white">История расчетов</h2><button onClick={onClear} className="text-red-500 text-sm hover:text-red-700 flex items-center"><i className="fas fa-trash-alt mr-1"></i>Очистить</button></div>
                    <div className="space-y-4">
                        {history.map((item) => (
                            <div key={item.id} className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-md transition-all">
                                <div className="flex justify-between items-start mb-3">
                                    <span className="text-xs text-gray-400 bg-gray-50 dark:bg-gray-700 px-2 py-1 rounded">{formatDate(item.timestamp)}</span>
                                    <span className={`text-sm font-bold ${item.netProfit > 0 ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>Прибыль: {formatMoney(item.netProfit)}</span>
                                </div>
                                <div className="flex items-center justify-between text-sm">
                                    <div className="flex flex-col"><span className="text-gray-500 text-xs">Покупка</span><span className="font-medium dark:text-gray-200">{formatMoney(item.purchaseAmount)}</span></div>
                                    <i className="fas fa-arrow-right text-gray-300 dark:text-gray-600"></i>
                                    <div className="flex flex-col text-right"><span className="text-gray-500 text-xs">Продажа</span><span className="font-medium dark:text-gray-200">{formatMoney(item.saleAmount)}</span></div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('purchase');
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [purchaseAmount, setPurchaseAmount] = useState('');
            const [purchaseVatInc, setPurchaseVatInc] = useState(false);
            const [saleAmount, setSaleAmount] = useState('');
            const [saleVatInc, setSaleVatInc] = useState(false);
            const [settings, setSettings] = useState({ purchaseVatRate: 22, saleVatRate: 22, profitTaxRate: 25, roundingEnabled: false, roundingMethod: 'round' });
            const [result, setResult] = useState(null);
            const [history, setHistory] = useState([]);

            useEffect(() => {
                const savedSettings = localStorage.getItem('calc_settings');
                const savedHistory = localStorage.getItem('calc_history');
                const savedTheme = localStorage.getItem('calc_theme');
                if (savedSettings) setSettings(JSON.parse(savedSettings));
                if (savedHistory) setHistory(JSON.parse(savedHistory));
                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) setIsDarkMode(true);
            }, []);

            useEffect(() => { localStorage.setItem('calc_settings', JSON.stringify(settings)); }, [settings]);
            useEffect(() => { localStorage.setItem('calc_history', JSON.stringify(history)); }, [history]);
            useEffect(() => { 
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('calc_theme', 'dark'); } 
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('calc_theme', 'light'); } 
            }, [isDarkMode]);

            const round = useCallback((val) => {
                if (!settings.roundingEnabled) return val;
                switch (settings.roundingMethod) {
                    case 'ceil': return Math.ceil(val);
                    case 'floor': return Math.floor(val);
                    default: return Math.round(val);
                }
            }, [settings]);

            const calculate = () => {
                const pAmount = parseFloat(purchaseAmount);
                const sAmount = parseFloat(saleAmount);
                if (isNaN(pAmount) || isNaN(sAmount)) return;

                let pNet, pVat, pGross;
                if (purchaseVatInc) { pGross = pAmount; pNet = pAmount / (1 + settings.purchaseVatRate / 100); pVat = pGross - pNet; } 
                else { pNet = pAmount; pVat = pAmount * (settings.purchaseVatRate / 100); pGross = pNet + pVat; }

                let sNet, sVat, sGross;
                if (saleVatInc) { sGross = sAmount; sNet = sAmount / (1 + settings.saleVatRate / 100); sVat = sGross - sNet; } 
                else { sNet = sAmount; sVat = sAmount * (settings.saleVatRate / 100); sGross = sNet + sVat; }

                const addedValue = sNet - pNet;
                const vatOnAddedValue = addedValue * (settings.saleVatRate / 100);
                const profitGross = sNet - pNet;
                const profitTax = Math.max(0, profitGross * (settings.profitTaxRate / 100));
                const vatToPay = sVat - pVat;
                const netProfit = profitGross - profitTax;

                const res = {
                    purchase: { net: round(pNet), gross: round(pGross), vat: round(pVat) },
                    sale: { net: round(sNet), gross: round(sGross), vat: round(sVat) },
                    addedValue: { amount: round(addedValue), vat: round(vatOnAddedValue) },
                    profit: { gross: round(profitGross), grossWithVat: round(sGross - pGross), tax: round(profitTax), vatToPay: round(vatToPay), net: round(netProfit) },
                };

                setResult(res);
                const newItem = { id: Date.now().toString(), timestamp: Date.now(), purchaseAmount: round(pGross), saleAmount: round(sGross), netProfit: round(netProfit), settings: { ...settings } };
                setHistory(prev => [newItem, ...prev].slice(0, 50));
                setActiveTab('result');
            };

            const handleReset = () => { setPurchaseAmount(''); setSaleAmount(''); setResult(null); setActiveTab('purchase'); };
            const clearHistory = () => { if(confirm('Очистить всю историю?')) setHistory([]); };

            return (
                <div className="min-h-screen pb-12 transition-colors duration-300">
                    <TabNavigation activeTab={activeTab} onTabChange={setActiveTab} isDarkMode={isDarkMode} toggleTheme={() => setIsDarkMode(!isDarkMode)} />
                    <main className="px-4">
                        <div className="max-w-3xl mx-auto">
                            {activeTab === 'purchase' && <InputPanel type="purchase" amount={purchaseAmount} setAmount={setPurchaseAmount} vatIncluded={purchaseVatInc} setVatIncluded={setPurchaseVatInc} onNext={() => setActiveTab('sale')} />}
                            {activeTab === 'sale' && <InputPanel type="sale" amount={saleAmount} setAmount={setSaleAmount} vatIncluded={saleVatInc} setVatIncluded={setSaleVatInc} onNext={calculate} />}
                            {activeTab === 'result' && <ResultsPanel result={result} settings={settings} onReset={handleReset} />}
                            {activeTab === 'settings' && <SettingsPanel settings={settings} onSave={(s) => { setSettings(s); alert('Настройки сохранены'); }} />}
                            {activeTab === 'history' && <HistoryPanel history={history} onClear={clearHistory} />}
                        </div>
                    </main>
                    {activeTab === 'result' && !result && (
                        <div className="text-center mt-20 text-gray-400 dark:text-gray-500">
                           <p>Введите данные в разделах Покупка и Продажа для расчета</p>
                           <button onClick={() => setActiveTab('purchase')} className="mt-4 text-indigo-600 dark:text-indigo-400 font-medium hover:underline">Перейти к заполнению</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
